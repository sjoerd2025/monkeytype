# Auto-sync: keep this fork current with its upstream original.
#
# Runs daily (UTC 04:20, off-peak) and on manual trigger. Uses the built-in
# GITHUB_TOKEN via the REST "update branch" API — no secrets, no third-party
# action. Behavior:
#   - fast-forwardable → branch updated (merge_commit_sha returned)
#   - already current  → 409 conflict, treated as clean skip
#   - diverged         → 409 conflict, logged for manual attention (never
#                        force-pushed; local work is never clobbered)
name: Sync with upstream
"on":
  schedule:
    - cron: "20 4 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: sync-with-upstream
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync default branch with upstream
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          http_code=$(curl -s -o /tmp/sync-resp.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/merge-upstream" \
            -d "{\"branch\":\"${BRANCH}\"}")
          case "${http_code}" in
            200)
              new_sha=$(jq -r '.merge_commit_sha // "unknown"' /tmp/sync-resp.json)
              echo "::notice::synced — new head ${new_sha}"
              ;;
            409)
              msg=$(jq -r '.message // "conflict"' /tmp/sync-resp.json)
              echo "::notice::no sync applied — ${msg}"
              ;;
            403)
              echo "::error::403 from merge-upstream (rate limit or forbidden). Response:"
              cat /tmp/sync-resp.json
              exit 1
              ;;
            *)
              echo "::error::unexpected HTTP ${http_code}. Response:"
              cat /tmp/sync-resp.json
              exit 1
              ;;
          esac
